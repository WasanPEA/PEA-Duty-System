<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PEA Duty System V1</title>
<style>
  body { font-family: sans-serif; background: #1a1a2e; color: #fff; margin: 0; padding: 20px; }
  header { text-align: center; margin-bottom: 20px; }
  h1 { font-size: 1.5rem; color: #a29bfe; margin: 0; }
  .nav { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
  button { padding: 10px 18px; border: none; border-radius: 6px; background: #6c5ce7; color: white; font-weight: bold; cursor: pointer; }
  button:hover { background: #5a4bcf; }
  .card { background: #16213e; padding: 20px; border-radius: 8px; margin-bottom: 15px; }
</style>
</head>
<body>

<header>
  <h1>⚡ ระบบตารางเวรออนไลน์ - PEA กฟส.ไชยปราการ V1</h1>
</header>

<div class="nav">
  <button onclick="show('duty')">📅 ตารางเวร</button>
  <button onclick="show('people')">👨‍🔧 พนักงาน</button>
  <button onclick="show('inc')">🚨 เหตุขัดข้อง</button>
  <button onclick="show('set')">⚙️ ตั้งค่า</button>
</div>

<section id="duty" class="card">
  <h2>📅 ตารางเวร</h2>
  <p>หน้าตารางเวรทำงานปกติแล้ว</p>
</section>

<section id="people" class="card" style="display:none">
  <h2>👨‍🔧 พนักงาน</h2>
  <p>หน้าพนักงานทำงานปกติแล้ว</p>
</section>

<section id="inc" class="card" style="display:none">
  <h2>🚨 เหตุขัดข้อง</h2>
  <p>หน้าเหตุขัดข้องทำงานปกติแล้ว</p>
</section>

<section id="set" class="card" style="display:none">
  <h2>⚙️ ตั้งค่า</h2>
  <p>หน้าตั้งค่าทำงานปกติแล้ว</p>
</section>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbzXzp7BLmQl_chspMVAP0Z5hSKGmSST1xUsa-6_ofs80tQVVvCFByIwE4kJGS2x15/exec";

  function show(id) {
    ['duty', 'people', 'inc', 'set'].forEach(x => {
      document.getElementById(x).style.display = (x === id) ? 'block' : 'none';
    });
  }
</script>

</body>
</html>
